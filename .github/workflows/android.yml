name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Java Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}" >> "$GITHUB_ENV"
      - name: Configure Godot editor Android paths
        shell: bash
        run: |
          godot --headless --editor --path . --quit
          godot --headless --editor --path . --script tools/configure_android.gd
      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/BattleLegends-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BattleLegends-Android-v0.1
          path: build/BattleLegends-v0.1.apk
