name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Java Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}" >> "$GITHUB_ENV"
      - name: Configure Godot editor Android paths
        timeout-minutes: 5
        shell: bash
        run: |
          timeout 120s godot --headless --editor --path . --quit
          timeout 120s godot --headless --editor --path . --script tools/configure_android.gd --quit-after 10
      - name: Smoke test game scripts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --quit-after 120 2>&1 | tee /tmp/game-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/game-smoke.log; then
            exit 1
          fi
      - name: Automated regression suite
        timeout-minutes: 10
        shell: bash
        run: bash tools/run_tests.sh
      - name: Export debug APK
        timeout-minutes: 10
        run: godot --headless --path . --export-debug "Android" build/BattleLegends-v0.2.apk
      - name: Validate APK content and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/BattleLegends-v0.2.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" | grep -Fx 'AndroidManifest.xml'
          unzip -Z1 "$apk" | grep -Fx 'classes.dex'
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libgodot_android.so'
          unzip -Z1 "$apk" | grep -Fx 'assets/project.binary'
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep -F "package: name='com.battlelegends.prototype'" /tmp/apk-badging.txt
          grep -F "'arm64-v8a'" /tmp/apk-badging.txt
          sha256sum "$apk" > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BattleLegends-Android-v0.2
          if-no-files-found: error
          path: |
            build/BattleLegends-v0.2.apk
            build/SHA256SUMS.txt
      - name: Package the matching Godot validation runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/godot-runtime
          cp "$(command -v godot)" build/godot-runtime/godot
          godot --version > build/godot-runtime/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QA-Godot-4.4.1
          if-no-files-found: error
          path: build/godot-runtime/
